server:
  port: 8080
spring:
  # h2 연결 설정하는 부분
  datasource:
    # Spring Boot가 종료 과정에서 DB 연결 해제
    url: jdbc:h2:file:./data/boarddb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: test
    password: 1234
  jpa:
    # Java 객체와 데이터베이스 테이블을 연결
    # SQL 실행을 대신 처리해주는 ORM(Object-Relational Mapping,객체-관계형 데이터베이스 매핑) 프레임워크
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
